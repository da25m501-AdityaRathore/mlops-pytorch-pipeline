# Template only — copy to k8s/secret.yaml, fill in real values, and
# NEVER commit the filled-in version (k8s/*secret*.yaml is gitignored
# except this *.example.yaml file).
#
# Apply directly instead of committing secrets to Git:
#   kubectl create secret generic model-serving-secrets \
#     --namespace ml-training \
#     --from-literal=API_KEY=<real-value> \
#     --from-literal=MODEL_REGISTRY_TOKEN=<real-value>
#
# Or, for GitOps workflows, encrypt with a tool like Sealed Secrets or
# SOPS before committing so only ciphertext lives in the repo.
apiVersion: v1
kind: Secret
metadata:
  name: model-serving-secrets
  namespace: ml-training
type: Opaque
stringData:
  API_KEY: "REPLACE_ME"
  MODEL_REGISTRY_TOKEN: "REPLACE_ME"
