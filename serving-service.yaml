apiVersion: v1
kind: Service
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: mlops-pytorch-pipeline
    component: serving
spec:
  # Use ClusterIP for local clusters (Minikube/kind); switch to
  # LoadBalancer when running on a cloud-managed cluster (EKS/GKE/AKS).
  type: ClusterIP
  selector:
    app: mlops-pytorch-pipeline
    component: serving
  ports:
    - name: http
      port: 80
      targetPort: 8080
