apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: ml-training
  labels:
    app: mlops-pytorch-pipeline
    component: training
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: mlops-pytorch-pipeline
        component: training
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: TRAINING_CONFIG_PATH
              value: /app/configs/training_config.yaml
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs
            - name: data-volume
              mountPath: /app/data
            - name: checkpoint-volume
              mountPath: /app/checkpoints
      volumes:
        - name: config-volume
          configMap:
            name: training-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: ml-data-pvc
        - name: checkpoint-volume
          persistentVolumeClaim:
            claimName: ml-checkpoints-pvc

